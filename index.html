<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Play Lab – Vulcanul</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌋</text></svg>">
<style>
  :root { --orange:#ff7a1a; --yellow:#ffd23f; --blue:#3ec1ff; --purple:#8b5cf6; --green:#22c55e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background:#bfe9ff; }
  canvas { display:block; touch-action:none; }
  #overlay { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #overlay > * { pointer-events:auto; }
  #title { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#fff; color:var(--purple);
    padding:8px 18px; border-radius:999px; font-weight:bold; font-size:20px; box-shadow:0 4px 0 #0002; white-space:nowrap; }
  #hint { position:absolute; top:64px; left:50%; transform:translateX(-50%); width:min(92vw,460px); text-align:center;
    background:#fffbe6; color:#333; padding:10px 14px; border-radius:16px; font-size:18px; box-shadow:0 4px 0 #0002; }
  .btnrow { position:absolute; bottom:24px; left:0; right:0; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding:0 12px; }
  button { font:inherit; font-size:22px; font-weight:bold; border:none; border-radius:22px; padding:16px 26px; color:#fff;
    box-shadow:0 6px 0 #0003; cursor:pointer; min-width:140px; }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #0003; }
  button[hidden] { display:none; }
  #arBtn { background:var(--green); }
  #eruptBtn { background:var(--orange); }
  #resetBtn { background:var(--blue); font-size:18px; min-width:auto; }
  #exitBtn { position:absolute; top:12px; right:12px; background:#ef4444; font-size:16px; padding:8px 14px; min-width:auto; }
  #card { position:absolute; left:50%; bottom:110px; transform:translateX(-50%); width:min(92vw,440px); background:#fff;
    border:4px solid var(--yellow); border-radius:20px; padding:14px 16px; font-size:17px; color:#333; box-shadow:0 6px 0 #0002; }
  #card h3 { margin:0 0 6px; color:var(--orange); font-size:20px; }
  #card[hidden] { display:none; }
  #cardClose { position:absolute; top:6px; right:8px; background:transparent; color:#999; box-shadow:none; font-size:22px; padding:4px 8px; min-width:auto; }
</style>
</head>
<body>
<div id="overlay">
  <div id="title">🌋 AR Play Lab</div>
  <div id="hint">Se încarcă...</div>
  <button id="exitBtn" hidden>✕ Ieși</button>
  <div id="card" hidden>
    <button id="cardClose" aria-label="Închide">✕</button>
    <h3>Ce s-a întâmplat? 🔬</h3>
    <div>Adânc sub pământ e foarte cald, iar rocile se topesc și devin <b>magmă</b>.
      Gazele din magmă împing în sus, ca bulele dintr-o sticlă de suc agitată.
      Când presiunea e prea mare, magma iese prin <b>crater</b> – acum se numește <b>lavă</b>!</div>
  </div>
  <div class="btnrow">
    <button id="arBtn" hidden>📱 Pornește AR</button>
    <button id="eruptBtn" hidden>🔥 Erupe!</button>
    <button id="resetBtn" hidden>↺ Mută vulcanul</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const hint = $('hint'), arBtn = $('arBtn'), eruptBtn = $('eruptBtn'), resetBtn = $('resetBtn'),
      exitBtn = $('exitBtn'), card = $('card'), overlay = $('overlay');

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8866ff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(1, 2, 1);
scene.add(sun);

// ---------- Procedural volcano (cone + crater) ----------
// Built at "toy" size: ~24 cm wide, ~16 cm tall (good on a table in AR).
function makeVolcano() {
  const g = new THREE.Group();
  const H = 0.16, R = 0.12, rTop = 0.03;
  // Body: open-ended truncated cone (top hole = crater)
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(rTop, R, H, 40, 6, true),
    new THREE.MeshStandardMaterial({ color: 0x9b5a2e, roughness: 0.9, side: THREE.DoubleSide })
  );
  // little bumps for a friendly cartoon look
  const pos = body.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (Math.abs(y) < H / 2 - 0.001) {
      const ang = Math.atan2(pos.getZ(i), pos.getX(i));
      const k = 1 + 0.05 * Math.sin(ang * 7) * Math.cos(y * 60);
      pos.setX(i, pos.getX(i) * k); pos.setZ(i, pos.getZ(i) * k);
    }
  }
  body.geometry.computeVertexNormals();
  body.position.y = H / 2;
  g.add(body);
  // Green base "grass" ring
  const base = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.25, R * 1.3, 0.01, 40),
    new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 1 }));
  base.position.y = 0.005;
  g.add(base);
  // Crater: glowing lava disc slightly below rim
  const lava = new THREE.Mesh(new THREE.CircleGeometry(rTop * 0.95, 24),
    new THREE.MeshBasicMaterial({ color: 0xff5a00 }));
  lava.rotation.x = -Math.PI / 2;
  lava.position.y = H - 0.01;
  g.add(lava);
  // Crater rim
  const rim = new THREE.Mesh(new THREE.TorusGeometry(rTop, 0.006, 8, 24),
    new THREE.MeshStandardMaterial({ color: 0x6b3a1e, roughness: 0.9 }));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = H;
  g.add(rim);
  g.userData = { craterY: H, craterR: rTop, lava };
  return g;
}
const volcano = makeVolcano();
volcano.visible = false;
scene.add(volcano);

// ---------- Lava particles (InstancedMesh pool) ----------
const MAX_P = 400;
const pGeo = new THREE.SphereGeometry(0.006, 8, 6);
const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const particles = new THREE.InstancedMesh(pGeo, pMat, MAX_P);
particles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
particles.frustumCulled = false;
volcano.add(particles);
const P = Array.from({ length: MAX_P }, () => ({ alive: false, p: new THREE.Vector3(), v: new THREE.Vector3(), life: 0, s: 1 }));
const lavaColors = [0xff3b00, 0xff7a1a, 0xffb000, 0xffd23f, 0xff1f1f].map(c => new THREE.Color(c));
const tmpM = new THREE.Matrix4(), hidden = new THREE.Matrix4().makeScale(0, 0, 0);
for (let i = 0; i < MAX_P; i++) { particles.setMatrixAt(i, hidden); particles.setColorAt(i, lavaColors[i % lavaColors.length]); }
let eruptTime = 0, spawnAcc = 0;

function spawn(n) {
  const { craterY, craterR } = volcano.userData;
  for (const q of P) {
    if (n <= 0) break;
    if (q.alive) continue;
    const a = Math.random() * Math.PI * 2, r = Math.random() * craterR * 0.7;
    q.p.set(Math.cos(a) * r, craterY, Math.sin(a) * r);
    const spread = 0.12 + Math.random() * 0.18;
    q.v.set(Math.cos(a) * spread, 0.7 + Math.random() * 0.45, Math.sin(a) * spread);
    q.life = 0; q.s = 0.7 + Math.random() * 1.1; q.alive = true; n--;
  }
}
function updateParticles(dt) {
  if (eruptTime > 0) {
    eruptTime -= dt;
    spawnAcc += dt * 220;
    const n = Math.floor(spawnAcc); spawnAcc -= n; spawn(n);
    volcano.userData.lava.material.color.setHSL(0.03 + 0.04 * Math.random(), 1, 0.5);
  }
  let any = false;
  for (let i = 0; i < MAX_P; i++) {
    const q = P[i];
    if (!q.alive) continue;
    any = true;
    q.life += dt;
    q.v.y -= 2.2 * dt;               // gravity (scaled for toy size)
    q.p.addScaledVector(q.v, dt);
    if (q.p.y < 0.005) {             // hit the ground: lava flow, slow down
      q.p.y = 0.005; q.v.set(q.v.x * 0.3, 0, q.v.z * 0.3);
    }
    if (q.life > 2.2) { q.alive = false; particles.setMatrixAt(i, hidden); continue; }
    const s = q.s * (1 - q.life / 2.6);
    tmpM.makeScale(s, s, s).setPosition(q.p);
    particles.setMatrixAt(i, tmpM);
  }
  if (any || eruptTime > 0) particles.instanceMatrix.needsUpdate = true;
}
function erupt() {
  if (!volcano.visible) return;
  eruptTime = 2.5;
  card.hidden = true;
  setTimeout(() => { card.hidden = false; }, 3200);
  if (navigator.vibrate) navigator.vibrate([80, 40, 120]);
}

// ---------- Reticle ----------
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffd23f })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ---------- Fallback 3D preview (desktop / iPhone / no WebXR AR) ----------
let controls = null, previewGroup = null;
function startPreview() {
  scene.background = new THREE.Color(0xbfe9ff);
  previewGroup = new THREE.Group();
  const table = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.04, 0.6),
    new THREE.MeshStandardMaterial({ color: 0xffc078, roughness: 0.8 }));
  table.position.y = -0.02;
  previewGroup.add(table);
  scene.add(previewGroup);
  volcano.position.set(0, 0, 0);
  volcano.visible = true;
  camera.position.set(0.35, 0.35, 0.5);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.1, 0);
  controls.enableDamping = true;
  controls.minDistance = 0.25; controls.maxDistance = 1.5;
  controls.update();
  eruptBtn.hidden = false;
  hint.textContent = 'Mod previzualizare 3D: rotește cu degetul sau mouse-ul, apoi apasă „Erupe!”';
}
function stopPreview() {
  if (previewGroup) { scene.remove(previewGroup); previewGroup = null; }
  if (controls) { controls.dispose(); controls = null; }
  scene.background = null;
}

// ---------- WebXR AR session ----------
let hitTestSource = null, xrSession = null;
async function startAR() {
  try {
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'local-floor'],
      domOverlay: { root: overlay }
    });
  } catch (e) {
    hint.textContent = 'Nu am putut porni AR 😕 (' + (e && e.message ? e.message : e) + ')';
    return;
  }
  stopPreview();
  volcano.visible = false;
  eruptBtn.hidden = true; arBtn.hidden = true; exitBtn.hidden = false; card.hidden = true;
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(xrSession);
  hint.textContent = 'Mișcă încet telefonul deasupra mesei sau podelei… 👀';

  const viewerSpace = await xrSession.requestReferenceSpace('viewer');
  hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });

  // Taps on DOM buttons must not also place the volcano.
  for (const b of [eruptBtn, resetBtn, exitBtn, $('cardClose')]) {
    b.addEventListener('beforexrselect', (ev) => ev.preventDefault());
  }
  xrSession.addEventListener('select', () => {
    if (volcano.visible || !reticle.visible) return;
    volcano.position.setFromMatrixPosition(reticle.matrix);
    // face the camera (yaw only)
    const camPos = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
    volcano.rotation.set(0, Math.atan2(camPos.x - volcano.position.x, camPos.z - volcano.position.z), 0);
    volcano.visible = true; reticle.visible = false;
    eruptBtn.hidden = false; resetBtn.hidden = false;
    hint.textContent = 'Super! Acum apasă „Erupe!” 🔥';
  });
  xrSession.addEventListener('end', () => {
    hitTestSource = null; xrSession = null;
    reticle.visible = false; exitBtn.hidden = true; resetBtn.hidden = true;
    arBtn.hidden = false;
    renderer.setAnimationLoop(null);
    startPreview();
    renderer.setAnimationLoop(loop);
  });
}

// ---------- Main loop ----------
const clock = new THREE.Clock();
function loop(time, frame) {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (frame && hitTestSource && !volcano.visible) {
    const refSpace = renderer.xr.getReferenceSpace();
    const hits = frame.getHitTestResults(hitTestSource);
    if (hits.length) {
      const pose = hits[0].getPose(refSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
      hint.textContent = 'Am găsit o suprafață! Atinge ecranul ca să pui vulcanul 🌋';
    } else {
      reticle.visible = false;
    }
  }
  if (controls) controls.update();
  updateParticles(dt);
  renderer.render(scene, camera);
}

// ---------- UI wiring ----------
eruptBtn.addEventListener('click', erupt);
arBtn.addEventListener('click', startAR);
exitBtn.addEventListener('click', () => xrSession && xrSession.end());
$('cardClose').addEventListener('click', () => { card.hidden = true; });
resetBtn.addEventListener('click', () => {
  volcano.visible = false; eruptBtn.hidden = true; resetBtn.hidden = true; card.hidden = true;
  hint.textContent = 'Caută un loc nou și atinge ecranul 👆';
});
window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Feature detection ----------
async function init() {
  let arOK = false;
  try { arOK = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch (e) { arOK = false; }
  startPreview();
  if (arOK) {
    arBtn.hidden = false;
    hint.textContent = 'Telefonul tău știe AR! Apasă „Pornește AR” și pune vulcanul pe masă. (Sau încearcă aici în 3D.)';
  } else if (!window.isSecureContext) {
    hint.textContent = 'AR are nevoie de HTTPS. Deocamdată, joacă-te în modul 3D 👇';
  }
  renderer.setAnimationLoop(loop);
  window.__arPlayLab = { arOK, erupt, particles: () => P.filter(q => q.alive).length };
}
init();
</script>
</body>
</html>
