<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Play Lab – Vulcanul</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌋</text></svg>">
<style>
  :root { --orange:#ff7a1a; --yellow:#ffd23f; --blue:#3ec1ff; --purple:#8b5cf6; --green:#22c55e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; background:#c5e6f6; }
  canvas { display:block; touch-action:none; }
  #overlay { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #overlay > * { pointer-events:auto; }
  #title { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:#fff; color:var(--purple);
    padding:8px 18px; border-radius:999px; font-weight:bold; font-size:20px; box-shadow:0 4px 0 #0002; white-space:nowrap; }
  #hint { position:absolute; top:64px; left:50%; transform:translateX(-50%); width:min(92vw,460px); text-align:center;
    background:#fffbe6; color:#333; padding:10px 14px; border-radius:16px; font-size:18px; box-shadow:0 4px 0 #0002; }
  .btnrow { position:absolute; bottom:24px; left:0; right:0; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding:0 12px; }
  button { font:inherit; font-size:22px; font-weight:bold; border:none; border-radius:22px; padding:16px 26px; color:#fff;
    box-shadow:0 6px 0 #0003; cursor:pointer; min-width:140px; }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #0003; }
  button[hidden] { display:none; }
  #arBtn { background:var(--green); }
  #eruptBtn { background:var(--orange); }
  #resetBtn { background:var(--blue); font-size:18px; min-width:auto; }
  #exitBtn { position:absolute; top:12px; right:12px; background:#ef4444; font-size:16px; padding:8px 14px; min-width:auto; }
  #muteBtn { position:absolute; top:12px; left:12px; background:#334155; font-size:20px; padding:8px 12px; min-width:auto; }
  #card { position:absolute; left:50%; bottom:110px; transform:translateX(-50%); width:min(92vw,440px); background:#fff;
    border:4px solid var(--yellow); border-radius:20px; padding:14px 16px; font-size:17px; color:#333; box-shadow:0 6px 0 #0002; }
  #card h3 { margin:0 0 6px; color:var(--orange); font-size:20px; }
  #card[hidden] { display:none; }
  #cardClose { position:absolute; top:6px; right:8px; background:transparent; color:#999; box-shadow:none; font-size:22px; padding:4px 8px; min-width:auto; }
  #loader { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:#1c1410; color:#fff8ee; font-size:22px; font-weight:bold; }
  #loader[hidden] { display:none; }
  #loader .bar { width:min(72vw, 280px); height:12px; background:#3a2a22; border-radius:99px; overflow:hidden; }
  #loadBar { height:100%; width:0%; background:#ff7a1a; }
</style>
</head>
<body>
<div id="loader"><div>Se încarcă vulcanul…</div><div class="bar"><div id="loadBar"></div></div></div>
<div id="overlay">
  <div id="title">🌋 AR Play Lab</div>
  <div id="hint">Se încarcă...</div>
  <button id="muteBtn" type="button" aria-label="Oprește sunetul">🔊</button>
  <button id="exitBtn" hidden>✕ Ieși</button>
  <div id="card" hidden>
    <button id="cardClose" aria-label="Închide">✕</button>
    <h3>Ce s-a întâmplat? 🔬</h3>
    <div>Adânc sub pământ e foarte cald, iar rocile se topesc și devin <b>magmă</b>.
      Gazele din magmă împing în sus, ca bulele dintr-o sticlă de suc agitată.
      Când presiunea e prea mare, magma iese prin <b>crater</b> – acum se numește <b>lavă</b>!</div>
  </div>
  <div class="btnrow">
    <button id="arBtn" hidden>📱 Pornește AR</button>
    <button id="eruptBtn" hidden>🔥 Erupe!</button>
    <button id="resetBtn" hidden>↺ Mută vulcanul</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const $ = (id) => document.getElementById(id);
const hint = $('hint'), arBtn = $('arBtn'), eruptBtn = $('eruptBtn'), resetBtn = $('resetBtn'),
      exitBtn = $('exitBtn'), muteBtn = $('muteBtn'), card = $('card'), overlay = $('overlay');

function setHint(text) { if (hint.textContent !== text) hint.textContent = text; }

const HINT_PREVIEW = 'Mod previzualizare 3D: rotește cu degetul sau mouse-ul, apoi apasă „Erupe!”';
const HINT_LIFT = 'Ține telefonul puțin mai sus și mișcă-l încet';
const HINT_SCAN = 'Mișcă încet telefonul deasupra mesei… 👀';
const HINT_FOUND = 'Am găsit masa! Atinge ecranul ca să pui vulcanul 🌋';
const HINT_PLACED = 'Super! Acum apasă „Erupe!” 🔥';
const HINT_MOVE = 'Caută un loc nou pe masă și atinge ecranul 👆';

// ---------- Renderer / scene ----------
const dprCap = Math.min(window.devicePixelRatio || 1, 1.5);
const renderer = new THREE.WebGLRenderer({
  antialias: dprCap <= 1.25,
  alpha: true,
  powerPreference: 'high-performance',
  stencil: false,
});
renderer.setPixelRatio(dprCap);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearAlpha(0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.xr.enabled = true;
renderer.xr.setFramebufferScaleFactor(0.9);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.004, 20);

const hemi = new THREE.HemisphereLight(0xfff4e8, 0x5c5640, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dd, 7.5);
sun.position.set(0.6, 1.4, 0.4);
scene.add(sun);
const HEMI_IDLE = hemi.intensity;
const SUN_IDLE = sun.intensity;

let fallbackEnv = null;
try {
  const pmrem = new THREE.PMREMGenerator(renderer);
  fallbackEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();
  scene.environment = fallbackEnv;
} catch (e) { /* direct lights still shade the rock */ }

// ---------- Volcano (meshopt glTF + CC0 photo textures) ----------
const assetURL = (name) => new URL('./assets/' + name, import.meta.url).href;
let H = 0.176;
let poolSurface = 0.11;
let paths = [];
let flows = [];
let pool = null;
let rockMat = null;
let flowMat = null;
const uErupt = { value: 0.32 };
const uTime = { value: 0 };
const uHot = { value: 0.4 };

function softDisc() {
  const s = 64, data = new Uint8Array(s * s * 4);
  for (let y = 0; y < s; y++) {
    for (let x = 0; x < s; x++) {
      const dx = (x + 0.5) / s * 2 - 1, dy = (y + 0.5) / s * 2 - 1;
      const d = Math.hypot(dx, dy);
      const a = Math.pow(Math.max(0, 1 - d), 1.7);
      const i = (y * s + x) * 4;
      data[i] = data[i + 1] = data[i + 2] = 255; data[i + 3] = Math.min(255, a * 255);
    }
  }
  const tex = new THREE.DataTexture(data, s, s);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  return tex;
}
const softTex = softDisc();
function shadowTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 10, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.62)');
  grd.addColorStop(0.45, 'rgba(0,0,0,0.32)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function buildRibbon(points, lateral, yLift, w0, w1) {
  const pos = [], uv = [], idx = [];
  const n = points.length;
  const side = new THREE.Vector3(), tang = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const p = points[i];
    const nxt = points[Math.min(n - 1, i + 1)];
    const prv = points[Math.max(0, i - 1)];
    tang.subVectors(nxt, prv);
    if (tang.lengthSq() < 1e-8) tang.set(0, -1, 0);
    tang.normalize();
    side.set(-tang.z, 0, tang.x);
    if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
    side.normalize();
    const w = w0 + t * w1;
    const y = p.y + yLift;
    const ox = side.x * lateral, oz = side.z * lateral;
    pos.push(p.x + side.x * w + ox, y, p.z + side.z * w + oz);
    pos.push(p.x - side.x * w + ox, y, p.z - side.z * w + oz);
    uv.push(0, t * 2.2, 1, t * 2.2);
  }
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.setDrawRange(0, 0);
  return geo;
}
function makeLavaMaterial(edgeFade) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: null },
      uEmit: { value: null },
      uTime,
      uHot,
      uEdge: { value: edgeFade },
    },
    toneMapped: true,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -2,
    polygonOffsetUnits: -2,
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uColor;
      uniform sampler2D uEmit;
      uniform float uTime;
      uniform float uHot;
      uniform float uEdge;
      varying vec2 vUv;
      void main() {
        vec2 uv = vec2(vUv.x, fract(vUv.y * 1.6 - uTime * (0.12 + uHot * 0.45)));
        uv.x = fract(uv.x + sin((vUv.y * 8.0) + uTime * 1.7) * 0.02);
        vec3 crust = texture2D(uColor, uv).rgb;
        vec3 glow = texture2D(uEmit, vec2(uv.x * 1.3, fract(uv.y * 0.8 + uTime * 0.07))).rgb;
        float cracks = clamp(glow.r * 1.15 + crust.r * 0.45 + crust.g * 0.2, 0.0, 1.25);
        float edge = mix(1.0, smoothstep(0.0, 0.22, vUv.x) * smoothstep(1.0, 0.78, vUv.x), uEdge);
        cracks *= edge;
        vec3 crustCol = crust * vec3(0.42, 0.12, 0.04);
        vec3 magma = vec3(1.0, 0.34, 0.03);
        vec3 whiteHot = vec3(1.0, 0.86, 0.42);
        vec3 col = mix(crustCol, magma, 0.55 + 0.45 * smoothstep(0.08, 0.5, cracks));
        col = mix(col, whiteHot, smoothstep(0.42, 0.9, cracks) * (0.35 + uHot * 0.7));
        gl_FragColor = vec4(col * (0.9 + cracks * (0.55 + uHot * 0.45)), 1.0);
      }
    `,
  });
}
function prepTexture(tex, colorSpace) {
  tex.colorSpace = colorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy() || 1);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  return tex;
}

const volcano = new THREE.Group();
const shake = new THREE.Group();
volcano.add(shake);
const craterLight = new THREE.PointLight(0xff6a20, 0.012, 0.12, 2);
craterLight.position.y = H - 0.02;
shake.add(craterLight);
const craterGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: softTex, color: 0xff5a12, transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, toneMapped: false, opacity: 0.55,
}));
craterGlow.position.y = 0.11;
craterGlow.scale.set(0.028, 0.02, 1);
shake.add(craterGlow);
const outerGlow = craterGlow.clone();
outerGlow.material = craterGlow.material.clone();
outerGlow.material.opacity = 0.18;
outerGlow.scale.set(0.055, 0.04, 1);
shake.add(outerGlow);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.52), new THREE.MeshBasicMaterial({
  map: shadowTex(), transparent: true, depthWrite: false, toneMapped: false,
}));
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = 0.003;
shadow.renderOrder = -1;
volcano.add(shadow);
volcano.visible = false;
scene.add(volcano);

async function loadVolcano() {
  const bar = document.getElementById('loadBar');
  const manager = new THREE.LoadingManager();
  manager.onProgress = (_url, loaded, total) => {
    if (bar && total) bar.style.width = Math.round((loaded / total) * 100) + '%';
  };
  const texLoader = new THREE.TextureLoader(manager);
  const gltfLoader = new GLTFLoader(manager);
  if (MeshoptDecoder.ready) await MeshoptDecoder.ready;
  gltfLoader.setMeshoptDecoder(MeshoptDecoder);
  const [gltf, albedo, normal, rough, lavaColor, lavaEmit, meta] = await Promise.all([
    gltfLoader.loadAsync(assetURL('volcano.glb')),
    texLoader.loadAsync(assetURL('rock_albedo.webp')),
    texLoader.loadAsync(assetURL('rock_normal.webp')),
    texLoader.loadAsync(assetURL('rock_rough.webp')),
    texLoader.loadAsync(assetURL('lava_color.webp')),
    texLoader.loadAsync(assetURL('lava_emit.webp')),
    fetch(assetURL('volcano.json')).then((r) => { if (!r.ok) throw new Error('meta'); return r.json(); }),
  ]);
  prepTexture(albedo, THREE.SRGBColorSpace);
  prepTexture(normal, THREE.NoColorSpace);
  prepTexture(rough, THREE.NoColorSpace);
  prepTexture(lavaColor, THREE.SRGBColorSpace);
  prepTexture(lavaEmit, THREE.NoColorSpace);

  H = meta.height;
  poolSurface = meta.poolY;
  paths = meta.paths.map((path) => path.map((p) => new THREE.Vector3(p[0], p[1], p[2])));

  rockMat = new THREE.MeshStandardMaterial({
    map: albedo,
    normalMap: normal,
    roughnessMap: rough,
    normalScale: new THREE.Vector2(1.15, 1.15),
    roughness: 0.92,
    metalness: 0.02,
    envMapIntensity: 0.4,
    emissive: new THREE.Color(0x000000),
    emissiveIntensity: 1,
  });
  rockMat.onBeforeCompile = (shader) => {
    shader.uniforms.uErupt = uErupt;
    shader.uniforms.uRockScale = { value: 4.2 };
    shader.vertexShader = shader.vertexShader
      .replace('#include <uv_pars_vertex>', '#include <uv_pars_vertex>\nattribute vec2 uv1;\nvarying float vHeat;\nvarying vec3 vWPos;\nvarying vec3 vWNrm;')
      .replace('#include <uv_vertex>', '#include <uv_vertex>\nvHeat = uv1.x;')
      .replace('#include <normal_vertex>', '#include <normal_vertex>\n\tvWNrm = normalize(mat3(modelMatrix) * objectNormal);\n\tvWPos = (modelMatrix * vec4(position, 1.0)).xyz;');
    shader.fragmentShader = `
uniform float uErupt;
uniform float uRockScale;
varying float vHeat;
varying vec3 vWPos;
varying vec3 vWNrm;
vec3 rockBlend(vec3 n) {
  vec3 b = pow(abs(n), vec3(4.0));
  return b / (b.x + b.y + b.z + 1e-4);
}
` + shader.fragmentShader
      .replace('#include <normal_fragment_maps>', `
        vec3 nrmW = normalize(vWNrm);
        vec3 bN = rockBlend(nrmW);
        vec3 axisX = vec3(nrmW.x >= 0.0 ? 1.0 : -1.0, 0.0, 0.0);
        vec3 axisY = vec3(0.0, nrmW.y >= 0.0 ? 1.0 : -1.0, 0.0);
        vec3 axisZ = vec3(0.0, 0.0, nrmW.z >= 0.0 ? 1.0 : -1.0);
        vec3 mx = texture2D(normalMap, vWPos.yz * uRockScale).xyz * 2.0 - 1.0;
        vec3 my = texture2D(normalMap, vWPos.xz * uRockScale).xyz * 2.0 - 1.0;
        vec3 mz = texture2D(normalMap, vWPos.xy * uRockScale).xyz * 2.0 - 1.0;
        mx.xy *= normalScale; my.xy *= normalScale; mz.xy *= normalScale;
        vec3 nX = normalize(vec3(0.0, 0.0, 1.0) * mx.x + vec3(0.0, 1.0, 0.0) * mx.y + axisX * mx.z);
        vec3 nY = normalize(vec3(1.0, 0.0, 0.0) * my.x + vec3(0.0, 0.0, 1.0) * my.y + axisY * my.z);
        vec3 nZ = normalize(vec3(1.0, 0.0, 0.0) * mz.x + vec3(0.0, 1.0, 0.0) * mz.y + axisZ * mz.z);
        normal = normalize(mat3(viewMatrix) * normalize(nX * bN.x + nY * bN.y + nZ * bN.z));
      `)
      .replace('#include <map_fragment>', `
        vec3 bC = rockBlend(normalize(vWNrm));
        vec4 sampledDiffuseColor = texture2D(map, vWPos.yz * uRockScale) * bC.x
          + texture2D(map, vWPos.xz * uRockScale) * bC.y
          + texture2D(map, vWPos.xy * uRockScale) * bC.z;
        diffuseColor *= sampledDiffuseColor;
      `)
      .replace('#include <roughnessmap_fragment>', `
        vec3 bR = rockBlend(normalize(vWNrm));
        float roughTex = dot(vec3(
          texture2D(roughnessMap, vWPos.yz * uRockScale).g,
          texture2D(roughnessMap, vWPos.xz * uRockScale).g,
          texture2D(roughnessMap, vWPos.xy * uRockScale).g
        ), bR);
        float roughnessFactor = roughness * roughTex;
      `)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float heat = smoothstep(0.7, 1.0, clamp(vHeat, 0.0, 1.0));
        totalEmissiveRadiance += vec3(0.45, 0.12, 0.015) * heat * uErupt;`);
  };
  rockMat.customProgramCacheKey = () => 'volcano-triplanar-v1';

  // Meshopt quantization stores the sculpt in a normalized box and puts the
  // real tabletop size on the node. The geometry alone is several times too big.
  gltf.scene.updateMatrixWorld(true);
  let rockGeo = null;
  gltf.scene.traverse((obj) => {
    if (obj.isMesh && !rockGeo) {
      rockGeo = obj.geometry.clone();
      rockGeo.applyMatrix4(obj.matrixWorld);
    }
  });
  if (!rockGeo) throw new Error('mesh');
  // The compressed normal accessor is a normalized integer. Writing unit
  // floats into it truncates to 0 and the rock renders unlit.
  rockGeo.deleteAttribute('normal');
  rockGeo.computeVertexNormals();
  try { rockGeo.computeTangents(); } catch (e) { /* derivative normals still shade */ }
  const rock = new THREE.Mesh(rockGeo, rockMat);
  shake.add(rock);

  flowMat = makeLavaMaterial(1);
  flowMat.uniforms.uColor.value = lavaColor;
  flowMat.uniforms.uEmit.value = lavaEmit;
  const poolMat = makeLavaMaterial(0);
  poolMat.uniforms.uColor.value = lavaColor;
  poolMat.uniforms.uEmit.value = lavaEmit;
  flows = paths.flatMap((pts) => {
    const sheets = [
      buildRibbon(pts, 0, -0.0016, 0.016, 0.03),
    ];
    return sheets.map((geo) => {
      const mesh = new THREE.Mesh(geo, flowMat);
      mesh.frustumCulled = false;
      mesh.visible = false;
      mesh.renderOrder = 2;
      shake.add(mesh);
      return mesh;
    });
  });
  pool = new THREE.Mesh(new THREE.CircleGeometry(meta.poolR * 1.2, 48), poolMat);
  pool.rotation.x = -Math.PI / 2;
  pool.position.y = meta.poolY;
  pool.renderOrder = 2;
  shake.add(pool);
  craterLight.position.y = meta.poolY + 0.01;
  craterGlow.position.y = meta.poolY + 0.012;
  outerGlow.position.y = meta.poolY + 0.014;
}

// ---------- Ejecta (irregular bombs, streak sparks, soft ash) ----------
const tmpM = new THREE.Matrix4();
const tmpS = new THREE.Vector3();
const tmpP = new THREE.Vector3();
const tmpDir = new THREE.Vector3();
const tmpQ = new THREE.Quaternion();
const rollQ = new THREE.Quaternion();
const yAxis = new THREE.Vector3(0, 1, 0);
const camQ = new THREE.Quaternion();
const parentQ = new THREE.Quaternion();
const localQ = new THREE.Quaternion();
function makeBombGeo() {
  const geo = new THREE.IcosahedronGeometry(1, 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const len = Math.hypot(x, y, z) || 1;
    x /= len; y /= len; z /= len;
    const lump = 0.78
      + 0.16 * Math.sin(x * 2.6 + 0.7) * Math.cos(y * 2.1 + z)
      + 0.1 * Math.sin(z * 3.4 + y * 1.6)
      + 0.07 * Math.cos(x * 4.2 - z * 2.5);
    p.setXYZ(i, x * lump * 1.15, y * lump * 0.72, z * lump);
  }
  geo.computeVertexNormals();
  return geo;
}
function makeStreakGeo() {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([
    -0.5, 0, 0, 0.5, 0, 0, -0.08, 1, 0, 0.08, 1, 0,
  ], 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([
    0, 0, 1, 0, 0, 1, 1, 1,
  ], 2));
  geo.setIndex([0, 1, 2, 1, 3, 2]);
  return geo;
}
function quatAlongY(dir, roll, target) {
  tmpDir.copy(dir);
  if (tmpDir.lengthSq() < 1e-8) tmpDir.set(0, 1, 0);
  else tmpDir.normalize();
  target.setFromUnitVectors(yAxis, tmpDir);
  if (roll) {
    rollQ.setFromAxisAngle(tmpDir, roll);
    target.premultiply(rollQ);
  }
}
const BOMB_N = 20;

let audio = null, muted = false, nextCrack = 0;
function ensureAudio() {

  if (!Ctx) return null;

    const ctx = new Ctx();
    const master = ctx.createGain();
    master.gain.value = 0.55;
    master.connect(ctx.destination);
    const len = ctx.sampleRate * 2;
    const noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0);
    let b0 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = (b0 + 0.02 * w) / 1.02;
      d[i] = b0 * 3.2;
    }
    const crack = ctx.createBuffer(1, (ctx.sampleRate * 0.09) | 0, ctx.sampleRate);
    const cd = crack.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * (1 - i / cd.length);
    function loop(buffer, type, freq) {

      src.buffer = buffer; src.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = type; filter.frequency.value = freq;
      const gain = ctx.createGain(); gain.gain.value = 0;
      src.connect(filter); filter.connect(gain); gain.connect(master); src.start();
      return gain;

    audio = { ctx, master, rumble: loop(noise, 'lowpass', 130), hiss: loop(noise, 'highpass', 900), crack };

  } catch (e) { return null; }
}

  a.rumble.gain.setValueAtTime(a.rumble.gain.value, now);
  a.rumble.gain.linearRampToValueAtTime(0.55, now + 0.12);
  a.rumble.gain.linearRampToValueAtTime(0.28, now + 2.4);
  a.rumble.gain.linearRampToValueAtTime(0, now + 4.4);
  a.hiss.gain.setValueAtTime(0, now);
  a.hiss.gain.linearRampToValueAtTime(0.08, now + 0.2);
  a.hiss.gain.linearRampToValueAtTime(0, now + 3.6);
  nextCrack = now + 0.1;
}

  const now = audio.ctx.currentTime;
  if (now < nextCrack) return;
  const src = audio.ctx.createBufferSource();
  src.buffer = audio.crack;
  const g = audio.ctx.createGain();
  g.gain.value = 0.12;
  src.connect(g); g.connect(audio.master); src.start();
  nextCrack = now + 0.1 + Math.random() * 0.2;
}

  basisX.cross(smoothedNor).normalize().multiplyScalar(pulse);
  basisZ.crossVectors(smoothedNor, basisX);
  reticle.matrix.makeBasis(basisX, smoothedNor, basisZ);
  reticle.matrix.setPosition(smoothedPos);
  reticle.visible = true;
  reticleMiss = 0;
  reticleShown += dt;
}
function hideReticle(dt) {
  reticleMiss += dt;
  reticleShown = 0;
  if (reticleMiss > 0.45) { reticle.visible = false; reticleHave = false; }
}

// ---------- Plane helpers ----------
const MIN_PLANE_AREA = 0.1;
const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
const rayOrigin = new THREE.Vector3(), rayDir = new THREE.Vector3(), forward = new THREE.Vector3();
const hitPoint = new THREE.Vector3();
const qCam = new THREE.Quaternion();

function polygonAreaXZ(poly) {
  let a = 0;
  for (let i = 0, n = poly.length; i < n; i++) {
    const p = poly[i], q = poly[(i + 1) % n];
    a += p.x * q.z - q.x * p.z;
  }
  return Math.abs(a) * 0.5;
}
function pointInPolyXZ(x, z, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i].x, zi = poly[i].z, xj = poly[j].x, zj = poly[j].z;
    if ((zi > z) !== (zj > z) && x < ((xj - xi) * (z - zi)) / ((zj - zi) || 1e-8) + xi) inside = !inside;
  }
  return inside;
}
function distPointSeg(px, pz, ax, az, bx, bz) {
  const abx = bx - ax, abz = bz - az;
  const t = Math.max(0, Math.min(1, ((px - ax) * abx + (pz - az) * abz) / (abx * abx + abz * abz || 1e-8)));
  return Math.hypot(px - (ax + abx * t), pz - (az + abz * t));
}
function distToPolyXZ(x, z, poly) {
  if (pointInPolyXZ(x, z, poly)) return 0;
  let best = Infinity;
  for (let i = 0, n = poly.length; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    best = Math.min(best, distPointSeg(x, z, a.x, a.z, b.x, b.z));
  }
  return best;
}

const RAY_DEFS = [[0, 0], [16, 0], [28, 0], [40, 0], [24, -16], [24, 16]];
function viewerDir(pitchDeg, yawDeg, target) {
  const p = pitchDeg * Math.PI / 180, y = yawDeg * Math.PI / 180;
  return target.set(Math.sin(y) * Math.cos(p), -Math.sin(p), -Math.cos(y) * Math.cos(p)).applyQuaternion(qCam).normalize();
}
const PLANE_HITS = Array.from({ length: 24 }, () => ({
  point: new THREE.Vector3(), t: 0, normal: new THREE.Vector3(), plane: null, center: false,
}));
function considerPlaneRay(info, pitch, yaw, center, hitCount) {
  if (hitCount >= PLANE_HITS.length) return hitCount;
  viewerDir(pitch, yaw, rayDir);
  const normal = info.normal;
  let nSign = 1;
  let denom = normal.dot(rayDir);
  if (denom > 0) { denom = -denom; nSign = -1; }
  if (denom > -1e-4) return hitCount;
  const t = (
    nSign * normal.x * (info.origin.x - rayOrigin.x) +
    nSign * normal.y * (info.origin.y - rayOrigin.y) +
    nSign * normal.z * (info.origin.z - rayOrigin.z)
  ) / denom;
  if (t < 0.28 || t > 2.15) return hitCount;
  hitPoint.copy(rayOrigin).addScaledVector(rayDir, t);
  const lx = (hitPoint.x - info.origin.x) * info.xAxis.x + (hitPoint.y - info.origin.y) * info.xAxis.y + (hitPoint.z - info.origin.z) * info.xAxis.z;
  const lz = (hitPoint.x - info.origin.x) * info.zAxis.x + (hitPoint.y - info.origin.y) * info.zAxis.y + (hitPoint.z - info.origin.z) * info.zAxis.z;
  if (distToPolyXZ(lx, lz, info.poly) > 0.05) return hitCount;
  const slot = PLANE_HITS[hitCount];
  slot.point.copy(hitPoint);
  slot.t = t;
  slot.normal.copy(normal);
  slot.plane = info.plane;
  slot.center = center;
  return hitCount + 1;
}

let stickyPlane = null;
const HIT_POOL = Array.from({ length: 12 }, () => ({ p: new THREE.Vector3(), n: new THREE.Vector3(), dist: 0, ray: 0 }));
let lockedY = null, highOnly = 0, agreeTime = 0;
const lastCand = new THREE.Vector3();

function resetPlacement() {
  stickyPlane = null; lockedY = null; highOnly = 0; agreeTime = 0;
  reticle.visible = false; reticleHave = false; reticleMiss = 1; reticleShown = 0;
}

function eachPlane(set, fn) {
  if (!set) return;
  if (typeof set.forEach === 'function') set.forEach(fn);
  else for (const plane of set) fn(plane);
}
function collectLargePlanes(frame, refSpace) {
  const out = [];
  eachPlane(frame.detectedPlanes, (plane) => {
    try {
      const poly = plane.polygon;
      if (!poly || poly.length < 3) return;
      const label = String(plane.semanticLabel || '').toLowerCase();
      if (/ceiling|wall|window|door|screen|monitor/.test(label)) return;
      const pose = frame.getPose(plane.planeSpace, refSpace);
      if (!pose) return;
      const e = pose.transform.matrix;
      vA.set(e[4], e[5], e[6]);
      if (plane.orientation === 'vertical') return;
      if (plane.orientation !== 'horizontal' && Math.abs(vA.y) < 0.82) return;
      if (vA.y < 0) return;
      const area = polygonAreaXZ(poly);
      if (area < MIN_PLANE_AREA) return;
      out.push({
        plane, area, poly,
        origin: new THREE.Vector3(e[12], e[13], e[14]),
        xAxis: new THREE.Vector3(e[0], e[1], e[2]),
        zAxis: new THREE.Vector3(e[8], e[9], e[10]),
        normal: vA.clone(),
      });
    } catch (err) { /* plane ended this frame */ }
  });
  return out;
}
function countTrackedPlanes(frame) {
  let n = 0;
  eachPlane(frame.detectedPlanes, () => { n++; });
  return n;
}
function pickPlaneHit(planes) {
  let n = 0;
  for (const info of planes) {
    for (let r = 0; r < RAY_DEFS.length; r++) {
      n = considerPlaneRay(info, RAY_DEFS[r][0], RAY_DEFS[r][1], r === 0, n);
    }
  }
  if (!n) return null;
  // Keep the highest surface the rays actually meet (the table), so a shallow
  // center ray that only reaches the floor does not win.
  let yMax = -Infinity;
  for (let i = 0; i < n; i++) if (PLANE_HITS[i].t < 1.6) yMax = Math.max(yMax, PLANE_HITS[i].point.y);
  if (yMax === -Infinity) yMax = PLANE_HITS[0].point.y;
  let best = null, sticky = null, center = null;
  for (let i = 0; i < n; i++) {
    const h = PLANE_HITS[i];
    if (h.point.y < yMax - 0.05) continue;
    if (h.plane === stickyPlane) sticky = h;
    if (h.center && (!center || h.t < center.t)) center = h;
    if (!best || h.t < best.t) best = h;
  }
  const chosen = (center && (!best || center.t < best.t + 0.35)) ? center : (sticky && best && best.t > sticky.t - 0.12 ? sticky : best);
  if (chosen) stickyPlane = chosen.plane;
  return chosen;
}
function pickHitTest(frame, refSpace, sources, shallow) {
  let n = 0, minY = Infinity;
  for (let s = 0; s < sources.length; s++) {
    const results = frame.getHitTestResults(sources[s].source);
    if (!results || !results.length) continue;
    const pose = results[0].getPose(refSpace);
    if (!pose) continue;
    const e = pose.transform.matrix;
    const slot = HIT_POOL[n];
    slot.p.set(e[12], e[13], e[14]);
    slot.n.set(e[4], e[5], e[6]);
    if (slot.n.y < 0.75) continue;
    slot.dist = slot.p.distanceTo(rayOrigin);
    if (slot.dist < 0.28 || slot.dist > 2.15) continue;
    slot.ray = sources[s].pitch;
    if (slot.p.y < minY) minY = slot.p.y;
    n++;
    if (n >= HIT_POOL.length) break;
  }
  if (!n) return null;
  const low = [];
  for (let i = 0; i < n; i++) if (HIT_POOL[i].p.y <= minY + 0.04) low.push(HIT_POOL[i]);
  if (lockedY !== null) {
    const good = [];
    for (let i = 0; i < n; i++) {
      const h = HIT_POOL[i];
      if (h.p.y < lockedY - 0.03 || Math.abs(h.p.y - lockedY) <= 0.035) good.push(h);
    }
    if (!good.length) return null;
    good.sort((a, b) => a.dist - b.dist);
    if (good[0].p.y < lockedY - 0.03) lockedY = good[0].p.y;
    return good[0];
  }
  let span = 0;
  for (let i = 0; i < low.length; i++) {
    for (let j = i + 1; j < low.length; j++) {
      const dx = low[i].p.x - low[j].p.x, dz = low[i].p.z - low[j].p.z;
      span = Math.max(span, Math.hypot(dx, dz));
    }
  }
  if (shallow && (low.length < 2 || span < 0.16)) return null;
  low.sort((a, b) => a.dist - b.dist);
  lockedY = low[0].p.y;
  return low[0];
}

// ---------- Fallback 3D preview ----------
let controls = null, previewGroup = null;
function startPreview() {
  scene.background = new THREE.Color(0xc5e6f6);
  scene.environment = fallbackEnv;
  hemi.intensity = HEMI_IDLE;
  sun.intensity = SUN_IDLE;
  sun.position.set(0.6, 1.4, 0.4);
  sun.color.setHex(0xfff1dd);
  previewGroup = new THREE.Group();
  const table = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.04, 0.78),
    new THREE.MeshStandardMaterial({ color: 0xc4926a, roughness: 0.72, metalness: 0.02 }));
  table.position.y = -0.02;
  previewGroup.add(table);
  scene.add(previewGroup);
  volcano.position.set(0, 0, 0);
  volcano.rotation.set(0, 0, 0);
  volcano.visible = true;
  camera.position.set(0.4, 0.3, 0.48);
  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.08, 0);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 0.05;
  controls.maxDistance = 1.6;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.update();
  eruptBtn.hidden = false;
  setHint(HINT_PREVIEW);
}
function stopPreview() {
  if (previewGroup) { scene.remove(previewGroup); previewGroup = null; }
  if (controls) { controls.dispose(); controls = null; }
  scene.background = null;
  scene.environment = null;
}

// ---------- WebXR ----------
let hitSources = [], xrSession = null, planeDetectionOn = false, lightProbe = null;
const xrLightProbe = new THREE.LightProbe();
xrLightProbe.intensity = 0;

function makeOffsetRay(pitchDeg, yawDeg) {
  const p = pitchDeg * Math.PI / 180, y = yawDeg * Math.PI / 180;
  const dir = {
    x: Math.sin(y) * Math.cos(p),
    y: -Math.sin(p),
    z: -Math.cos(y) * Math.cos(p),
    w: 0,
  };
  const len = Math.hypot(dir.x, dir.y, dir.z) || 1;
  dir.x /= len; dir.y /= len; dir.z /= len;
  return new XRRay({ x: 0, y: 0, z: 0, w: 1 }, dir);
}
async function startAR() {
  let session;
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'local-floor', 'plane-detection', 'light-estimation'],
      domOverlay: { root: overlay },
    });
  } catch (e) {
    setHint('Nu am putut porni AR 😕 (' + (e && e.message ? e.message : e) + ')');
    return;
  }
  xrSession = session;
  stopPreview();
  stopErupt();
  volcano.visible = false;
  resetPlacement();
  eruptBtn.hidden = true; arBtn.hidden = true; exitBtn.hidden = false; card.hidden = true;
  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(session);
  setHint(HINT_LIFT);

  const features = session.enabledFeatures ? Array.from(session.enabledFeatures) : [];
  planeDetectionOn = features.includes('plane-detection');
  const viewerSpace = await session.requestReferenceSpace('viewer');
  hitSources = [];
  for (const [pitch, yaw] of RAY_DEFS) {
    try {
      const source = await session.requestHitTestSource({
        space: viewerSpace,
        entityTypes: ['plane'],
        offsetRay: pitch === 0 && yaw === 0 ? undefined : makeOffsetRay(pitch, yaw),
      });
      hitSources.push({ source, pitch });
    } catch (e) { /* this ray is not supported */ }
  }
  if (!hitSources.length) {
    try {
      const source = await session.requestHitTestSource({ space: viewerSpace });
      hitSources.push({ source, pitch: 0 });
    } catch (e) { /* placement will wait */ }
  }
  if (features.includes('light-estimation') && session.requestLightProbe) {
    try { lightProbe = await session.requestLightProbe(); } catch (e) { lightProbe = null; }
  }

  for (const b of [eruptBtn, resetBtn, exitBtn, muteBtn, $('cardClose')]) {
    b.addEventListener('beforexrselect', (ev) => ev.preventDefault());
  }
  session.addEventListener('select', () => {
    if (volcano.visible || !reticle.visible || reticleShown < 0.12) return;
    volcano.position.copy(smoothedPos);
    const camPos = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
    volcano.rotation.set(0, Math.atan2(camPos.x - volcano.position.x, camPos.z - volcano.position.z), 0);
    volcano.visible = true;
    reticle.visible = false;
    eruptBtn.hidden = false; resetBtn.hidden = false;
    setHint(HINT_PLACED);
  });
  session.addEventListener('end', () => {
    for (const s of hitSources) { try { s.source.cancel(); } catch (e) { /* already ended */ } }
    hitSources = []; xrSession = null; lightProbe = null; planeDetectionOn = false;
    scene.remove(xrLightProbe); xrLightProbe.intensity = 0;
    reticle.visible = false; exitBtn.hidden = true; resetBtn.hidden = true; arBtn.hidden = false;
    renderer.setAnimationLoop(null);
    startPreview();
    renderer.setAnimationLoop(loop);
  });
}

function applyLightEstimate(est) {
  const sh = est.sphericalHarmonicsCoefficients;
  if (sh && sh.length >= 27) {
    xrLightProbe.sh.fromArray(sh);
    xrLightProbe.intensity = 1;
    if (!xrLightProbe.parent) scene.add(xrLightProbe);
  }
  const ix = est.primaryLightIntensity.x, iy = est.primaryLightIntensity.y, iz = est.primaryLightIntensity.z;
  const scale = Math.max(1, ix, iy, iz);
  sun.color.setRGB(ix / scale, iy / scale, iz / scale);
  sun.intensity = scale;
  sun.position.set(est.primaryLightDirection.x, est.primaryLightDirection.y, est.primaryLightDirection.z);
  hemi.intensity = 0.18;
}

function updatePlacement(frame, dt, time) {
  if (!frame || volcano.visible) return;
  const refSpace = renderer.xr.getReferenceSpace();
  const viewer = frame.getViewerPose(refSpace);
  if (!viewer) { hideReticle(dt); setHint(HINT_LIFT); return; }
  const o = viewer.transform.orientation, p = viewer.transform.position;
  qCam.set(o.x, o.y, o.z, o.w);
  rayOrigin.set(p.x, p.y, p.z);
  forward.set(0, 0, -1).applyQuaternion(qCam);
  const shallow = forward.y > -0.45;

  let placed = null;
  let sawPlanes = false;
  if (planeDetectionOn && frame.detectedPlanes) {
    sawPlanes = countTrackedPlanes(frame) > 0;
    const planes = collectLargePlanes(frame, refSpace);
    const hit = planes.length ? pickPlaneHit(planes) : null;
    if (hit) {
      placed = hit;
      lockedY = hit.point.y;
    }
  }
  // Raw hit-test is only a fallback before any real plane exists. Once ARCore
  // reports planes, small ones (keyboard, mouse, stand) must not win.
  const allowHitTest = !planeDetectionOn || !sawPlanes;
  if (!placed && allowHitTest && hitSources.length) {
    const hit = pickHitTest(frame, refSpace, hitSources, shallow);
    if (hit && (lockedY === null || hit.p.y <= lockedY + 0.035)) {
      if (lastCand.distanceTo(hit.p) < 0.06) agreeTime += dt; else agreeTime = 0;
      lastCand.copy(hit.p);
      if (!shallow || agreeTime > 0.12) placed = { point: hit.p, normal: hit.n };
    } else if (lockedY !== null) {
      highOnly += dt;
      if (highOnly > 1.1) { lockedY = null; highOnly = 0; }
    }
  }
  if (placed) {
    const pos = placed.point || placed.p;
    const nor = placed.normal || placed.n;
    vC.copy(pos).addScaledVector(nor, 0.005);
    showReticle(vC, nor, dt, time);
    setHint(HINT_FOUND);
  } else {
    hideReticle(dt);
    if (!reticle.visible) setHint(shallow || planeDetectionOn ? HINT_LIFT : HINT_SCAN);
  }
}

// ---------- Main loop ----------
const clock = new THREE.Clock();
function loop(timeMs, frame) {
  const time = timeMs * 0.001;
  const dt = Math.min(clock.getDelta(), 0.05);
  if (frame && lightProbe) {
    try {
      const est = frame.getLightEstimate(lightProbe);
      if (est) applyLightEstimate(est);
    } catch (e) { /* probe not ready */ }
  }
  if (xrSession && !volcano.visible) updatePlacement(frame, dt, time);
  if (controls && controls.enabled) controls.update();
  updateEruption(dt, time);
  updateAudio();
  renderer.render(scene, camera);
}

// ---------- UI ----------
eruptBtn.addEventListener('click', erupt);
arBtn.addEventListener('click', startAR);
exitBtn.addEventListener('click', () => xrSession && xrSession.end());
$('cardClose').addEventListener('click', () => { card.hidden = true; });
resetBtn.addEventListener('click', () => {
  volcano.visible = false;
  stopErupt();
  resetPlacement();
  eruptBtn.hidden = true; resetBtn.hidden = true; card.hidden = true;
  setHint(HINT_MOVE);
});
window.addEventListener('resize', () => {
  if (renderer.xr.isPresenting) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function focusCrater() {
  camera.near = 0.002;
  camera.fov = 42;
  camera.updateProjectionMatrix();
  // Inside the mouth, a few centimetres above the lip, looking down at the pool.
  camera.position.set(0.004, H + 0.036, 0.01);
  camera.lookAt(0, poolSurface, -0.004);
  puffs.visible = false;
  bombsMesh.visible = false;
  sparksMesh.visible = false;
  trailsMesh.visible = false;
  if (controls) controls.enabled = false;
}
function focusRim() {
  camera.near = 0.003;
  camera.fov = 36;
  camera.updateProjectionMatrix();
  camera.position.set(0.11, H + 0.1, 0.16);
  camera.lookAt(0, H + 0.01, 0);
  bombsMesh.visible = true;
  sparksMesh.visible = true;
  trailsMesh.visible = true;
  puffs.visible = true;
  if (controls) controls.enabled = false;
}
async function init() {
  try {
    await loadVolcano();
  } catch (e) {
    const loader = document.getElementById('loader');
    if (loader) loader.firstElementChild.textContent = 'Nu am putut încărca vulcanul.';
    setHint('Nu am putut încărca vulcanul. Reîncarcă pagina.');
    return;
  }
  const loader = document.getElementById('loader');
  if (loader) loader.hidden = true;
  let arOK = false;
  try { arOK = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch (e) { arOK = false; }
  startPreview();
  if (arOK) {
    arBtn.hidden = false;
    setHint('Telefonul tău știe AR! Apasă „Pornește AR” și pune vulcanul pe masă. (Sau încearcă aici în 3D.)');
  } else if (!window.isSecureContext) {
    setHint('AR are nevoie de HTTPS. Deocamdată, joacă-te în modul 3D 👇');
  }
  renderer.setAnimationLoop(loop);
  window.__arPlayLab = { arOK, erupt, particles: aliveCount, focusCrater, focusRim };
}
init();
